<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        /* min-height : évite la hauteur 0 si la WebView n'est pas encore mesurée */
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
               min-height: 200px; background: #cfe8ff; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const dbg = document.getElementById('dbg');


    const map = L.map('map').setView([34.0, 9.5], 6);

    // Recalcule la taille de la carte quand la WebView change de taille
    function fixSize() {
      map.invalidateSize();
    }
    window.addEventListener('resize', fixSize);
    if (window.ResizeObserver) new ResizeObserver(fixSize).observe(document.getElementById('map'));
    setTimeout(fixSize, 300);
    setTimeout(fixSize, 1000);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = null;

    function notify(latlng) { Android.onMoved(latlng.lat, latlng.lng); }

    function place(lat, lng) {
      if (marker) { marker.setLatLng([lat, lng]); return; }
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', () => notify(marker.getLatLng()));
    }

    // Appelée par Kotlin après le géocodage
    function focusOn(lat, lng) {
      map.invalidateSize();
      place(lat, lng);
      map.setView([lat, lng], 17);
    }

    // Toucher la carte place (ou déplace) le marqueur
    map.on('click', e => { place(e.latlng.lat, e.latlng.lng); notify(e.latlng); });
</script>
</body>
</html>
